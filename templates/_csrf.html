<meta name="csrf-token" content="{{ csrf_token() }}">
<script>
  // Protección CSRF: agrega automáticamente la cabecera X-CSRFToken a
  // cualquier fetch() que cambie datos (POST/PUT/PATCH/DELETE), sin tener
  // que tocar cada uno de los archivos JS del sistema (cada módulo tiene
  // su propia función fetch/api()). Se hace una sola vez acá, envolviendo
  // window.fetch globalmente.
  (function () {
    const metaTag = document.querySelector('meta[name="csrf-token"]');
    const token = metaTag ? metaTag.getAttribute("content") : "";
    const metodosProtegidos = new Set(["POST", "PUT", "PATCH", "DELETE"]);
    const fetchOriginal = window.fetch;
    window.fetch = function (recurso, opciones) {
      opciones = opciones || {};
      const metodo = (opciones.method || "GET").toUpperCase();
      if (metodosProtegidos.has(metodo)) {
        const headers = new Headers(opciones.headers || {});
        if (!headers.has("X-CSRFToken")) {
          headers.set("X-CSRFToken", token);
        }
        opciones = Object.assign({}, opciones, { headers });
      }
      return fetchOriginal.call(this, recurso, opciones);
    };
  })();
</script>
