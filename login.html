<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión — Inventario Taller</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  .login-box {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
  }
  .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 24px; justify-content: center; }
  .login-brand h1 { font-family: var(--font-display); text-transform: uppercase; font-size: 22px; margin: 0; }
  .login-brand h1 span { color: var(--accent); margin-left: 6px; }
  .login-error {
    background: var(--danger-soft);
    color: var(--danger);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 13.5px;
    margin-bottom: 16px;
  }
  .login-box .campo { margin-bottom: 16px; }
  .login-box button { width: 100%; padding: 11px; font-size: 15px; }
</style>
</head>
<body>

<div class="login-box">
  <div class="login-brand">
    <span class="brand-tag">01</span>
    <h1>Inventario<span>Taller</span></h1>
  </div>

  {% if error %}
  <div class="login-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="/login">
    <div class="campo">
      <label>Usuario</label>
      <input type="text" name="username" autofocus required autocomplete="username">
    </div>
    <div class="campo">
      <label>Contraseña</label>
      <input type="password" name="password" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary">Ingresar</button>
  </form>
</div>

</body>
</html>
